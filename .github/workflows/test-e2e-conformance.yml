name: End to End Tests [Conformance]

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: Setup upterm debugging session
        required: false
        default: 'false'

jobs:
  test-e2e:
    strategy:
      fail-fast: false
      matrix:
        infrastructure: [lxd, incus]
        arch: [amd64, arm64]

    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        with:
          detached: true
          limit-access-to-users: neoaggelos

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Prepare runner
        run: |
          ./hack/scripts/ci/setup-github-actions.sh

      - name: Setup infrastructure
        run: |
          ./hack/scripts/ci/setup-${{ matrix.infrastructure }}.sh

      # NOTE(neoaggelos): for tags, we should use the released controller image instead of building from source
      - name: Build the e2e controller image
        run: make e2e-image

      - name: Run e2e tests
        run: make test-conformance

      - name: Upload e2e artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifacts-${{ matrix.infrastructure }}-${{ matrix.arch }}
          path: _artifacts
